<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Base | AI VoiceAgent</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080b12;
            color: #f5f7fb;
            font-family: Arial, Helvetica, sans-serif;
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            background: #0d111a;
            border-right: 1px solid #1d2635;
            padding: 25px 16px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px 30px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #1683ff, #00d9ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 25px rgba(0, 174, 255, 0.25);
        }

        .brand-text h2 {
            margin: 0;
            font-size: 18px;
        }

        .brand-text span {
            font-size: 11px;
            color: #7f8ba3;
        }

        .nav-title {
            font-size: 11px;
            color: #667085;
            padding: 10px 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 13px 14px;
            margin: 5px 0;
            border-radius: 10px;
            color: #9ca8bb;
            text-decoration: none;
            transition: 0.2s;
            font-size: 14px;
        }

        .nav-item:hover {
            background: #151c28;
            color: #ffffff;
        }

        .nav-item.active {
            background: linear-gradient(
                90deg,
                rgba(26, 133, 255, 0.18),
                rgba(0, 217, 255, 0.05)
            );
            color: #42b8ff;
            border: 1px solid rgba(35, 153, 255, 0.15);
        }

        .nav-icon {
            width: 20px;
            text-align: center;
        }

        .sidebar-bottom {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 16px;
        }

        .logout-btn {
            width: 100%;
            border: 1px solid #202a3a;
            background: #111722;
            color: #aab4c5;
            padding: 11px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 13px;
        }

        .logout-btn:hover {
            background: #191f2c;
            color: white;
        }

        /* MAIN */

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 35px;
        }

        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 600;
        }

        .page-header p {
            margin: 0;
            color: #7e899d;
            font-size: 14px;
        }

        .add-btn {
            border: none;
            background: linear-gradient(135deg, #1683ff, #00bfe8);
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .add-btn:hover {
            transform: translateY(-1px);
        }

        /* TOOLBAR */

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
        }

        .search-box input,
        .category-filter {
            width: 100%;
            height: 46px;
            border: 1px solid #273244;
            background: #0e131d;
            color: #e8edf5;
            border-radius: 10px;
            outline: none;
            padding: 0 14px;
            font-size: 13px;
        }

        .search-box input:focus,
        .category-filter:focus {
            border-color: #1683ff;
        }

        .category-filter {
            width: 190px;
        }

        /* KNOWLEDGE GRID */

        .knowledge-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .knowledge-card {
            background: #0e131d;
            border: 1px solid #1c2635;
            border-radius: 14px;
            padding: 22px;
            transition: 0.2s;
        }

        .knowledge-card:hover {
            border-color: #263b55;
            transform: translateY(-1px);
        }

        .knowledge-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .knowledge-title {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #f0f3f8;
        }

        .category-badge {
            display: inline-block;
            margin-top: 9px;
            padding: 5px 9px;
            border-radius: 20px;
            background: rgba(22, 131, 255, 0.1);
            color: #46adff;
            font-size: 10px;
        }

        .knowledge-content {
            margin: 18px 0;
            color: #8d99ab;
            font-size: 13px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .knowledge-footer {
            padding-top: 14px;
            border-top: 1px solid #182130;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .knowledge-date {
            color: #5f6b7e;
            font-size: 10px;
        }

        .delete-btn {
            border: 1px solid rgba(239, 68, 68, 0.2);
            background: rgba(239, 68, 68, 0.06);
            color: #f87171;
            padding: 7px 11px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 11px;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.12);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: #0e131d;
            border: 1px solid #1c2635;
            border-radius: 14px;
            color: #667085;
            font-size: 13px;
        }

        /* MODAL */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 600px;
            background: #0e131d;
            border: 1px solid #253044;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: #151c27;
            color: #8995a8;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #b9c2d0;
            font-size: 12px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            border: 1px solid #273244;
            background: #090e16;
            color: white;
            border-radius: 9px;
            outline: none;
            padding: 12px;
            font-size: 13px;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
            line-height: 1.6;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #1683ff;
        }

        .save-btn {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #1683ff, #00bfe8);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .form-message {
            margin-top: 12px;
            text-align: center;
            font-size: 12px;
            min-height: 16px;
        }

        .form-message.success {
            color: #4ade80;
        }

        .form-message.error {
            color: #f87171;
        }

        /* RESPONSIVE */

        @media (max-width: 900px) {
            .knowledge-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 750px) {

            .sidebar {
                width: 70px;
                padding: 15px 8px;
            }

            .brand-text,
            .nav-title,
            .nav-item span,
            .sidebar-bottom {
                display: none;
            }

            .brand {
                justify-content: center;
                padding-bottom: 20px;
            }

            .nav-item {
                justify-content: center;
                padding: 13px 5px;
            }

            .main {
                margin-left: 70px;
                width: calc(100% - 70px);
                padding: 20px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .toolbar {
                flex-direction: column;
            }

            .category-filter {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">✦</div>

            <div class="brand-text">
                <h2>AI VoiceAgent</h2>
                <span>Intelligent Calling Platform</span>
            </div>
        </div>

        <div class="nav-title">Main Menu</div>

        <a href="dashboard.html" class="nav-item">
            <div class="nav-icon">⌂</div>
            <span>Dashboard</span>
        </a>

        <a href="make-call.html" class="nav-item">
            <div class="nav-icon">☎</div>
            <span>Make a Call</span>
        </a>

        <a href="knowledge-base.html" class="nav-item active">
            <div class="nav-icon">▤</div>
            <span>Knowledge Base</span>
        </a>

        <a href="call-history.html" class="nav-item">
            <div class="nav-icon">◷</div>
            <span>Call History</span>
        </a>

        <div class="nav-title" style="margin-top: 18px;">System</div>

        <a href="#" class="nav-item">
            <div class="nav-icon">⚙</div>
            <span>Settings</span>
        </a>

        <div class="sidebar-bottom">
            <button class="logout-btn" onclick="logout()">
                Logout
            </button>
        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <div class="page-header">

            <div>
                <h1>Knowledge Base</h1>
                <p>
                    Manage the information used by your AI VoiceAgent.
                </p>
            </div>

            <button class="add-btn" onclick="openModal()">
                + Add Knowledge
            </button>

        </div>


        <!-- SEARCH / FILTER -->

        <div class="toolbar">

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search knowledge..."
                >
            </div>

            <select
                id="categoryFilter"
                class="category-filter"
            >
                <option value="all">All Categories</option>
            </select>

        </div>


        <!-- KNOWLEDGE -->

        <div
            class="knowledge-grid"
            id="knowledgeGrid"
        >

            <div class="empty-state">
                Loading knowledge base...
            </div>

        </div>

    </main>

</div>


<!-- ADD KNOWLEDGE MODAL -->

<div
    class="modal-overlay"
    id="modalOverlay"
>

    <div class="modal">

        <div class="modal-header">

            <h2>Add Knowledge</h2>

            <button
                class="close-btn"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <form id="knowledgeForm">

            <div class="form-group">

                <label for="title">
                    Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="e.g. Product Pricing"
                    required
                >

            </div>


            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <input
                    type="text"
                    id="category"
                    placeholder="e.g. Pricing, Product, Company"
                >

            </div>


            <div class="form-group">

                <label for="content">
                    Knowledge Content
                </label>

                <textarea
                    id="content"
                    placeholder="Enter the information that the AI should know..."
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                class="save-btn"
            >
                Save Knowledge
            </button>


            <div
                class="form-message"
                id="formMessage"
            ></div>

        </form>

    </div>

</div>


<script src="knowledge-base.js"></script>

</body>
</html>
